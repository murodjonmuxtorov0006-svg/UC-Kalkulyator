<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Xarajatlar Kalkulyatori</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #ffa500;
            /* PUBGning sariq/apelsin rangi */
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
            /* Qutidan chiqib ketmasligi uchun */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ffa500;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #cc8400;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #333;
            border-radius: 5px;
            text-align: center;
            display: none;
            /* Dastlab yashirin turadi */
        }

        .result span {
            color: #ffa500;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>

<body>

    <div class="calculator-box">
        <h2>PUBG UC Kalkulyatori</h2>
        <p style="text-align: center; font-size: 12px; color: #aaa;">Akkauntingizga qancha sarflaganingizni hisoblang!
        </p>

        <div class="input-group">
            <label>Royale Pass uchun sarflangan UC:</label>
            <input type="number" id="uc-rp" placeholder="Masalan: 360" min="0">
        </div>

        <div class="input-group">
            <label>Qutilar (Crates) uchun sarflangan UC:</label>
            <input type="number" id="uc-crates" placeholder="Masalan: 1200" min="0">
        </div>

        <div class="input-group">
            <label>Kiyim va Skinlar uchun sarflangan UC:</label>
            <input type="number" id="uc-skins" placeholder="Masalan: 600" min="0">
        </div>

        <button onclick="hisoblash()">Hisoblash</button>

        <div class="result" id="natija-qutisi">
            <p>Jami sarflangan: <br><span id="jami-uc">0</span> UC</p>
            <p>Bu taxminan: <br><span id="jami-som">0</span> so'm</p>
        </div>
    </div>

    <script>
        // Dasturning "Miyasi"
        function hisoblash() {
            // Kiritilgan ma'lumotlarni o'qib olamiz. Agar bo'sh bo'lsa, 0 deb qabul qilamiz.
            let rp = Number(document.getElementById('uc-rp').value) || 0;
            let crates = Number(document.getElementById('uc-crates').value) || 0;
            let skins = Number(document.getElementById('uc-skins').value) || 0;

            // Jami UC ni qo'shamiz
            let jamiUC = rp + crates + skins;

            // 1 UC narxini taxminan 150 so'm deb olamiz (buni o'zgartirishingiz mumkin)
            let narxSomda = jamiUC * 150;

            // Natijani ekranga chiqaramiz
            document.getElementById('jami-uc').innerText = jamiUC;

            // So'mni chiroyli qilib (probel bilan) yozish uchun toLocaleString() ishlatamiz
            document.getElementById('jami-som').innerText = narxSomda.toLocaleString('uz-UZ');

            // Natija qutisini ko'rinadigan qilamiz
            document.getElementById('natija-qutisi').style.display = 'block';
        }
    </script>

</body>

</html>
