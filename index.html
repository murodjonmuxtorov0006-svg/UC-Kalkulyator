<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Kalkulyator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('uc_kalkulyator_background.svg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #111; 
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden; /* Ekran yoniga siljib ketmasligi uchun */
        }

        .calculator-box {
            background-color: rgba(15, 15, 15, 0.85); 
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 165, 0, 0.4);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 165, 0, 0.3);
            transition: 0.3s;
            position: relative;
            z-index: 10;
        }

        h2 {
            text-align: center;
            color: #ffcc00; 
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px #000;
            font-size: 24px;
        }

        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ffcc00;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ffcc00, #ff8c00); 
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.6);
            background: linear-gradient(90deg, #ffb300, #e67e22);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            text-align: center;
            display: none;
            border-left: 4px solid #ffcc00;
            border-right: 4px solid #ff8c00;
        }

        .result p { margin: 10px 0; font-size: 15px; color: #ccc; }
        .result span { font-weight: bold; font-size: 1.6em; display: block; margin-top: 5px; }
        .uc-text { color: #ffcc00; }
        .som-text { color: #00ff88; } 

        /* TANGALAR UCHUN ANIMATSIYA */
        .coin-effect {
            position: absolute;
            font-size: 25px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 9999;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="calculator-box" id="calc-box">
        <h2>UC Kalkulyator</h2>

        <div class="input-group">
            <label>Royale Pass uchun (UC):</label>
            <input type="number" id="uc-rp" placeholder="Masalan: 360" min="0">
        </div>
        <div class="input-group">
            <label>Qutilar uchun (UC):</label>
            <input type="number" id="uc-crates" placeholder="Masalan: 1200" min="0">
        </div>
        <div class="input-group">
            <label>Skinlar uchun (UC):</label>
            <input type="number" id="uc-skins" placeholder="Masalan: 600" min="0">
        </div>

        <button id="hisob-tugmasi" onclick="hisoblash()">Hisoblash</button>

        <div class="result" id="natija-qutisi">
            <p>Jami sarflangan: <span class="uc-text" id="jami-uc">0 UC</span></p>
            <p>Haqiqiy pulda: <span class="som-text" id="jami-som">0 so'm</span></p>
        </div>
    </div>

    <script>
        // HISOB-KITOB
        function hisoblash() {
            let tugma = document.getElementById('hisob-tugmasi');
            let natijaQutisi = document.getElementById('natija-qutisi');

            tugma.innerText = "Hisoblanmoqda... ⚙️";
            tugma.style.opacity = "0.8";
            natijaQutisi.style.display = 'none'; 

            setTimeout(function() {
                let rp = Number(document.getElementById('uc-rp').value) || 0;
                let crates = Number(document.getElementById('uc-crates').value) || 0;
                let skins = Number(document.getElementById('uc-skins').value) || 0;

                let jamiUC = rp + crates + skins;
                let narxSomda = Math.round((jamiUC / 60) * 11500);

                document.getElementById('jami-uc').innerText = jamiUC.toLocaleString('uz-UZ') + " UC";
                document.getElementById('jami-som').innerText = narxSomda.toLocaleString('uz-UZ') + " so'm";
                
                tugma.innerText = "Hisoblash";
                tugma.style.opacity = "1";
                natijaQutisi.style.display = 'block'; 
            }, 800); 
        }

        // TANGALAR VA OVOZ
        document.addEventListener('click', function(e) {
            let coinSound = new Audio('https://www.myinstants.com/media/sounds/mario-coin.mp3');
            coinSound.volume = 0.6;
            coinSound.play().catch(error => { console.log("Ovoz kutilmoqda"); });

            let coin = document.createElement('div');
            coin.className = 'coin-effect';
            coin.innerText = '🪙';
            
            // XATO SHU YERDA EDI: Endi ham yonidan, ham tepasidan aniq hisoblab chiqadi
            coin.style.left = (e.pageX - 12) + 'px';
            coin.style.top = (e.pageY - 12) + 'px';
            
            document.body.appendChild(coin);

            // 1 soniyadan keyin tangani o'chirib tashlaydi (qotib qolmasligi uchun)
            setTimeout(() => { coin.remove(); }, 1000);
        });
    </script>

</body>
</html>
