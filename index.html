<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBG Xarajatlar Kalkulyatori</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            /* Orqa fonga PUBG rasmi qo'shildi */
            background-image: url('https://wallpapercave.com/wp/wp4551550.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-box {
            /* Quti orqasi biroz xira (shaffof) qilindi, zamonaviy oyna effekti */
            background-color: rgba(30, 30, 30, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 165, 0, 0.6);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(5px); 
        }

        h2 {
            text-align: center;
            color: #ffa500;
            margin-top: 0;
            text-shadow: 2px 2px 4px #000;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            box-sizing: border-box;
            border: 1px solid #555;
            font-size: 16px;
        }

        /* Tugma dizayni */
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffa500;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #ffcc00;
            transform: scale(1.02); /* Sishqoncha borganda ozgina kattalashadi */
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.8);
            border-radius: 5px;
            text-align: center;
            display: none;
            border: 1px solid #ffa500;
        }

        .result span {
            color: #ffa500;
            font-weight: bold;
            font-size: 1.4em;
        }
    </style>
</head>
<body>

    <div class="calculator-box">
        <h2>PUBG UC Kalkulyatori</h2>
        <p style="text-align: center; font-size: 13px; color: #ccc;">Akkauntingizga qancha sarflaganingizni hisoblang!</p>

        <div class="input-group">
            <label>Royale Pass uchun (UC):</label>
            <input type="number" id="uc-rp" placeholder="Masalan: 360" min="0">
        </div>

        <div class="input-group">
            <label>Qutilar (Crates) uchun (UC):</label>
            <input type="number" id="uc-crates" placeholder="Masalan: 1200" min="0">
        </div>

        <div class="input-group">
            <label>Skinlar va boshqalar uchun (UC):</label>
            <input type="number" id="uc-skins" placeholder="Masalan: 600" min="0">
        </div>

        <button onclick="hisoblash()">Hisoblash</button>

        <div class="result" id="natija-qutisi">
            <p>Jami sarflangan: <br><span id="jami-uc">0</span> UC</p>
            <p>Bu taxminan: <br><span id="jami-som">0</span> so'm</p>
        </div>
    </div>

    <script>
        function hisoblash() {
            let rp = Number(document.getElementById('uc-rp').value) || 0;
            let crates = Number(document.getElementById('uc-crates').value) || 0;
            let skins = Number(document.getElementById('uc-skins').value) || 0;

            let jamiUC = rp + crates + skins;
            let narxSomda = jamiUC * 150;

            document.getElementById('jami-uc').innerText = jamiUC;
            document.getElementById('jami-som').innerText = narxSomda.toLocaleString('uz-UZ');
            
            // Natijani ko'rsatish
            document.getElementById('natija-qutisi').style.display = 'block';
        }
    </script>

</body>
</html>
